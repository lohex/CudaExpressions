[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kernex"
version = "0.1.0"
description = "Host-prepared mathematical runtime objects for inline evaluation in CUDA kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numba>=0.59", "numpy>=1.24", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
